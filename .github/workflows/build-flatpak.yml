name: Build Flatpak (feasibility test)

# Manual only for now — this is a proof-of-concept, not yet wired into the
# daily release like build-release.yml. Run from the Actions tab (or
# `gh workflow run build-flatpak.yml`) once it's proven to work reliably.
on:
  workflow_dispatch: {}

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xauth dbus-x11 gettext-base
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak bundle
        run: ./scripts/build-flatpak.sh

      - name: Install the bundle locally
        run: |
          flatpak install -y --user --noninteractive dist/AnycubicSlicerNext.flatpak

      - name: Headless smoke test (does it start without the icu/selinux crash?)
        run: |
          set +e
          # Run in the foreground under 'timeout' rather than backgrounding +
          # kill -0 — much more reliable output capture. Exit code 124 means
          # 'timeout' had to kill it, i.e. it was still alive/healthy after
          # 15s. Any other exit code means it crashed or exited on its own.
          dbus-run-session -- xvfb-run -a timeout 15 flatpak run --user io.github.lucywolf.AnycubicSlicerNext > run.log 2>&1
          rc=$?
          echo "----- run.log -----"
          cat run.log
          echo "----- exit code: $rc -----"
          if [ "$rc" -eq 124 ]; then
            echo "OK: still running when the 15s timeout fired — no early crash."
            echo "smoke_test=pass" >> "$GITHUB_ENV"
          else
            echo "Exited on its own with code $rc before the timeout — treating as failure."
            echo "smoke_test=fail" >> "$GITHUB_ENV"
          fi
        continue-on-error: true

      - name: Debug backtrace if the smoke test crashed
        if: env.smoke_test == 'fail'
        run: |
          sudo apt-get install -y gdb
          # /tmp is a private tmpfs inside the sandbox even with
          # --filesystem=host, so put this under the checkout dir instead —
          # that's a normal host path and is visible inside the sandbox.
          cat > "$PWD/dbg.sh" << 'EOF'
          #!/bin/bash
          export LD_LIBRARY_PATH=/app/lib:$LD_LIBRARY_PATH
          exec gdb -batch -ex run -ex "bt full" -ex quit --args /app/bin/AnycubicSlicerNext
          EOF
          chmod +x "$PWD/dbg.sh"
          dbus-run-session -- xvfb-run -a \
            flatpak run --command=bash --devel io.github.lucywolf.AnycubicSlicerNext -c "$PWD/dbg.sh" \
            2>&1 | tail -150
        continue-on-error: true

      - name: Fail job if smoke test failed
        if: env.smoke_test != 'pass'
        run: |
          echo "Smoke test did not pass — see the 'Headless smoke test' step log above."
          exit 1

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: AnycubicSlicerNext-flatpak
          path: dist/AnycubicSlicerNext.flatpak
