name: Check upstream and release

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream version
        id: check
        run: |
          ./scripts/check-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Check whether this tag was already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.check.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.exists.outputs.exists == 'false'
        run: ./scripts/build-package.sh

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            dist/AnycubicSlicerNext-linux-x86_64.tar.gz \
            AnycubicSlicerNext-arch-installer.desktop \
            AnycubicSlicerNext-deb-installer.desktop \
            install-arch.sh \
            install-deb.sh \
            --repo "${{ github.repository }}" \
            --title "AnycubicSlicerNext ${{ steps.check.outputs.version }} (build ${{ steps.check.outputs.build_id }})" \
            --notes "Two double-click installers, pick the one for your distro:
          - **Arch/CachyOS/Manjaro:** \`AnycubicSlicerNext-arch-installer.desktop\` — installs this repo's repack (Anycubic's official .deb bundled with the older libicu74/libselinux1 it needs, same fix as the anycubicslicernext-bin AUR package).
          - **Debian/Ubuntu/Mint:** \`AnycubicSlicerNext-deb-installer.desktop\` — installs Anycubic's official .deb directly via apt, no repack needed there.

          **Upstream source:** Anycubic Slicer Next v${{ steps.check.outputs.version }}, build ${{ steps.check.outputs.build_id }} (Ubuntu 24.04 .deb from cdn-universe-slicer.anycubic.com)."
