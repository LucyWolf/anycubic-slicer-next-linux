name: Check upstream and release

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream version
        id: check
        run: |
          ./scripts/check-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Check whether this tag was already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.check.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        if: steps.exists.outputs.exists == 'false'
        run: ./scripts/build-appimage.sh

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            dist/AnycubicSlicerNext-x86_64.AppImage \
            AnycubicSlicerNext-installer.desktop \
            install.sh \
            --repo "${{ github.repository }}" \
            --title "AnycubicSlicerNext ${{ steps.check.outputs.version }} (build ${{ steps.check.outputs.build_id }})" \
            --notes "Self-contained AppImage — no sudo, no system packages touched. Double-click \`AnycubicSlicerNext-installer.desktop\` to install, or run \`install.sh\` directly.

          Same build approach as thecalamityjoe87/anycubic-slicer-next-packages, wired into this repo's own auto-update pipeline.

          **Upstream source:** Anycubic Slicer Next v${{ steps.check.outputs.version }}, build ${{ steps.check.outputs.build_id }} (Ubuntu 24.04 .deb from cdn-universe-slicer.anycubic.com)."
